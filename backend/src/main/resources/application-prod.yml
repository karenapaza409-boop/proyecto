spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
cantomoda:
  cors-origins: ${CORS_ORIGINS:}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    root: WARN
    pe.edu.cantomoda: INFO
management:
  endpoints:
    web:
      exposure:
        include: health
